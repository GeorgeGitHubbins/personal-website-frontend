name: Periodic Website Improvement

on:
  schedule:
    - cron: '37 5 */3 * *' # Runs every 3 days at 5:37 AM UTC (Off-peak to avoid cron traffic spikes)
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  improve-website:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history for better context
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Pre-configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Lint Project
        run: npm run lint || echo "Linting failed, but continuing to allow Gemini to fix it."

      - name: Run Gemini CLI Autonomous Session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'eu-central-1'
        run: |
          gemini --skip-trust --prompt "Follow the 'Gemini CLI: Autonomous Mode Instructions' in GEMINI.md. We want high-quality, innovative, and visually premium improvements. You have a full 45 minutes—do not rush or settle for the simplest option. If you complete a task quickly, use the remaining time to polish the UI/UX, add fluid animations, improve responsiveness, and refine styles using CSS variables in App.css. Do not ask for user input." --approval-mode yolo

      - name: Commit Changes (Fallback)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: autonomous periodic improvement [skip ci]"
          else
            echo "No changes to commit"
          fi

      - name: Push Changes
        run: |
          git push || echo "Nothing to push"

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'eu-central-1'
        run: |
          aws s3 sync dist/ s3://ai.georgegittins.com --delete

      - name: Invalidate CloudFront Cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1' # CloudFront is global but usually managed from us-east-1
        run: |
          aws cloudfront create-invalidation --distribution-id E1IOHS3BJD2FUN --paths "/*"
